name: Evidence Review

on:
  push:
    branches: [main]
    paths:
      - 'evidence/**'
      - 'src/lib/evidenceReview.mjs'
      - 'scripts/validate-evidence-reviews.mjs'
      - 'tests/evidence-review.test.mjs'
      - '.github/workflows/evidence-review.yml'
  pull_request:
    branches: [main]
    paths:
      - 'evidence/**'
      - 'src/lib/evidenceReview.mjs'
      - 'scripts/validate-evidence-reviews.mjs'
      - 'tests/evidence-review.test.mjs'
      - '.github/workflows/evidence-review.yml'

permissions:
  contents: read

jobs:
  validate-review-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate review registry
        run: node scripts/validate-evidence-reviews.mjs
      - name: Review helper tests
        run: node --test tests/evidence-review.test.mjs
